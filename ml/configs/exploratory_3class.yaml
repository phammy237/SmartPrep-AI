# EXPLORATORY ONLY - not the v0 baseline. Trains on the only 3 classes that
# currently have enough real groups for a 3-way split (tomato/onion/potato,
# all from one Mendeley source, single domain). Numbers from this run say
# nothing about SmartPrep's real use case. See data/DATASET_AUDIT_v0.md.
run_name: exploratory-3class
seed: 42
classes_path: configs/classes_exploratory_3.json
data_dir: data/raw
acquired_provenance_paths:
  - data/provenance/bangladeshi_vegetables.csv
manifest_path: data/splits/manifest_exploratory_3.csv
force_resplit: false
image_size: 224
batch_size: 32
epochs: 8
learning_rate: 0.001
optimizer: adamw
weight_decay: 0.0001
pretrained: true
backbone: resnet18
num_workers: 0
device: cpu
output_dir: outputs
split: {train: 0.7, val: 0.15, test: 0.15}
augmentation: {random_horizontal_flip: true, random_rotation_degrees: 10.0, color_jitter: true}
early_stopping: {enabled: true, patience: 3, min_delta: 0.001}
